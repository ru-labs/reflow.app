name: Selfhost deploy

# Dokploy builds the head of the branch configured on each compose (test: feature/selfhost-poc,
# prod: main), so the tests must run on that same commit.
# The push trigger is needed because GitHub only offers "Run workflow" for files on the
# default branch; this one lives on the feature branch until the PoC is merged.
on:
  push:
    branches: [feature/selfhost-poc]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy (prod needs approval and must be run from main)
        type: choice
        options: [test, prod]
        default: test

permissions:
  contents: read

concurrency:
  group: selfhost-deploy
  cancel-in-progress: false

env:
  # push events have no inputs, so they always deploy test
  TARGET: ${{ inputs.environment || 'test' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reflow
          POSTGRES_PASSWORD: reflow
          POSTGRES_DB: reflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reflow -d reflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Prod deploys only from main
        if: env.TARGET == 'prod' && github.ref != 'refs/heads/main'
        run: echo "prod deploys must be run from main"; exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: App tests and lint
        env:
          # unit tests import the default (Supabase) backend, which throws without these; no request is made
          VITE_SUPABASE_URL: http://localhost
          VITE_SUPABASE_ANON_KEY: test
        run: |
          npm ci
          npm run test
          npm run lint

      - name: Server tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://reflow:reflow@localhost:5432/reflow_test
        run: |
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # selfhost-prod is a GitHub environment with required reviewers (the approval click)
    environment: ${{ inputs.environment == 'prod' && 'selfhost-prod' || 'selfhost-poc' }}
    env:
      DOKPLOY_URL: ${{ secrets.SELFHOST_DOKPLOY_URL }}
      DOKPLOY_TOKEN: ${{ secrets.SELFHOST_DOKPLOY_TOKEN }}
      COMPOSE_ID: ${{ inputs.environment == 'prod' && secrets.SELFHOST_COMPOSE_ID_PROD || secrets.SELFHOST_COMPOSE_ID }}
      HEALTH_URL: ${{ inputs.environment == 'prod' && 'https://prod.usereflow.app/api/health' || 'https://test.usereflow.app/api/health' }}
    steps:
      - name: Trigger the Dokploy deployment
        run: |
          latest() {
            curl -sS --fail-with-body -H "x-api-key: $DOKPLOY_TOKEN" \
              "$DOKPLOY_URL/api/deployment.allByCompose?composeId=$COMPOSE_ID" |
              jq -r 'sort_by(.createdAt) | last // {} | [(.deploymentId // ""), (.status // "")] | @tsv'
          }
          before=$(latest | cut -f1)
          echo "before=$before" >> "$GITHUB_ENV"

          curl -sS --fail-with-body -X POST \
            -H "x-api-key: $DOKPLOY_TOKEN" -H "Content-Type: application/json" \
            -d "{\"composeId\":\"$COMPOSE_ID\",\"title\":\"GitHub Actions run ${{ github.run_number }}\"}" \
            "$DOKPLOY_URL/api/compose.deploy"
          echo

      - name: Wait for the deployment to finish
        run: |
          latest() {
            curl -sS --fail-with-body -H "x-api-key: $DOKPLOY_TOKEN" \
              "$DOKPLOY_URL/api/deployment.allByCompose?composeId=$COMPOSE_ID" |
              jq -r 'sort_by(.createdAt) | last // {} | [(.deploymentId // ""), (.status // "")] | @tsv'
          }
          # 20 min timeout: the build happens on the VM
          for i in $(seq 1 120); do
            IFS=$'\t' read -r id status <<< "$(latest)"
            if [ -n "$id" ] && [ "$id" != "$before" ]; then
              echo "deployment $id: $status"
              case "$status" in
                done) exit 0 ;;
                error) echo "Dokploy deployment failed"; exit 1 ;;
              esac
            else
              echo "waiting for the new deployment to appear"
            fi
            sleep 10
          done
          echo "timed out waiting for the deployment"; exit 1

      - name: Health gate
        run: |
          for i in $(seq 1 12); do
            if curl -sS --fail-with-body "$HEALTH_URL" | jq -e '.ok == true'; then exit 0; fi
            sleep 5
          done
          echo "health check failed"; exit 1
