services:
  db:
    image: postgres:17-alpine          # pin 17: the 18 image moved its data dir, don't upgrade casually
    restart: unless-stopped
    environment:
      POSTGRES_USER: reflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reflow
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=100
      -c shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"          # localhost only, never 0.0.0.0 (Docker bypasses ufw)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflow -d reflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: deploy/selfhost/web.Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-production}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SUPABASE_SCHEMA: ${VITE_SUPABASE_SCHEMA:-public}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-}
        VITE_APP_COMMIT: ${VITE_APP_COMMIT:-}
    restart: unless-stopped
    expose:
      - "80"                           # no ports: Traefik reaches it over the network

volumes:
  pgdata:
    external: true
    name: reflow_pgdata                # created by the hand-made phase-05 project
