services:
  db:
    image: postgres:17-alpine          # pin 17: the 18 image moved its data dir, don't upgrade casually
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-512m}
    environment:
      POSTGRES_USER: reflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reflow
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      -c work_mem=${PG_WORK_MEM:-4MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
      -c shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"  # localhost only, never 0.0.0.0 (Docker bypasses ufw)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflow -d reflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: deploy/selfhost/web.Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-production}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SUPABASE_SCHEMA: ${VITE_SUPABASE_SCHEMA:-public}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-}
        VITE_APP_COMMIT: ${VITE_APP_COMMIT:-}
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-64m}
    expose:
      - "80"                           # no ports: Traefik reaches it over the network

  api:
    build: ../../server
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-384m}
    # explicit environment (no env_file) so the API never sees the build-only VITE_* values
    environment:
      DATABASE_URL: postgres://reflow:${POSTGRES_PASSWORD}@db:5432/reflow
      COOKIE_SECURE: "true"
      RUN_MIGRATIONS: "true"
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-10}
      APP_VERSION: ${APP_VERSION:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"                         # internal only, never ports:

volumes:
  pgdata:
    external: true
    name: ${PGDATA_VOLUME:-reflow_pgdata}   # created by hand (phase 05 / 13a)
